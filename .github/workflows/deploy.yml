name: "Deploy to GitHub Pages"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # Para abrir issue quando o deploy falhar. Issue aberta gera notificação do
  # GitHub, que é o caminho até o e-mail sem guardar credencial de SMTP aqui.
  issues: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        # npm ci (não npm install): instala exatamente o package-lock.json,
        # de forma determinística, e falha se o lock estiver fora de sincronia
        # com o package.json (B-04). npm install poderia resolver versões novas
        # dentro dos ranges ^ e mudar o build silenciosamente.
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Audit dependencies (bloqueia em high de produção)
        # Gate de supply chain (B-04): o deploy FALHA se houver vulnerabilidade
        # HIGH ou CRITICAL numa dependência servida ao visitante (--omit=dev).
        # O resumo completo fica no relatório do run para revisão.
        #
        # O gate esteve afrouxado em `critical` entre 04/08 e 18/09 por um único
        # motivo: o react-router 7.18.1 carregava um advisory high (RSC CSRF)
        # cuja única correção, na época, era um major arriscado. Em 18/09 saiu o
        # patch 7.18.2, a vulnerabilidade foi eliminada e as dependências
        # exclusivas do dev server saíram de `dependencies`. Com produção em
        # ZERO vulnerabilidades, o gate volta ao rigor que a auditoria pedia.
        #
        # Se algum dia isto barrar um deploy por um advisory que comprovadamente
        # não se aplica, prefira corrigir ou reclassificar a dependência a
        # afrouxar o gate de novo.
        run: |
          echo "## 🔍 npm audit (dependências de produção)" >> "$GITHUB_STEP_SUMMARY"
          npm audit --omit=dev >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          npm audit --omit=dev --audit-level=high

      - name: Build Site
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Abre issue quando build ou deploy falham. Antes, uma falha aqui ficava
  # visível só para quem abrisse a aba Actions: o site continuava servindo a
  # versão anterior, sem nenhum sinal de que a nova não subiu. Issue aberta
  # dispara a notificação do GitHub, que chega por e-mail.
  avisar-falha:
    if: failure()
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Abrir issue de falha no deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TODAY=$(date '+%Y-%m-%d')
          EXISTING=$(gh issue list --repo "$REPO" --label "deploy-failure" --state open --json number --jq 'length')
          if [ "$EXISTING" -eq "0" ]; then
            cat > "$RUNNER_TEMP/deploy-issue.md" <<MD
          O deploy do site falhou em $TODAY.

          Log do run: $RUN_URL

          **Impacto:** o site continua servindo a versão anterior. Nada quebrou para o visitante, mas mudanças novas não estão no ar.

          **Causas comuns:** teste reprovado, YAML de workflow inválido, ou o gate de \`npm audit\` barrando vulnerabilidade high em dependência de produção.

          Esta issue é aberta uma única vez enquanto o problema persistir.
          MD
            gh issue create --repo "$REPO" \
              --title "🔴 Falha no deploy: $TODAY" \
              --label "deploy-failure" \
              --body-file "$RUNNER_TEMP/deploy-issue.md"
          fi
