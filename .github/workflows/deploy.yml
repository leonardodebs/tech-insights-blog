name: "Deploy to GitHub Pages"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        # npm ci (não npm install): instala exatamente o package-lock.json,
        # de forma determinística, e falha se o lock estiver fora de sincronia
        # com o package.json (B-04). npm install poderia resolver versões novas
        # dentro dos ranges ^ e mudar o build silenciosamente.
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Audit dependencies (bloqueia em critical de produção)
        # Gate de supply chain (B-04): o deploy FALHA se houver vulnerabilidade
        # CRITICAL numa dependência servida ao visitante (--omit=dev). O resumo
        # completo (inclui high) fica no relatório do run para revisão.
        #
        # Por que critical e não high: o react-router 7.18 carrega um advisory
        # high de "RSC Mode CSRF", que exige React Server Components + server
        # actions. Este blog é uma SPA estática (HashRouter, sem servidor, sem
        # RSC), então o advisory não se aplica — bloquear por ele mataria todo
        # deploy sem risco real. Critical continua sendo hard-fail porque uma
        # vuln critical em dep de produção é grave o bastante para parar tudo.
        run: |
          echo "## 🔍 npm audit (dependências de produção)" >> "$GITHUB_STEP_SUMMARY"
          npm audit --omit=dev >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          npm audit --omit=dev --audit-level=critical

      - name: Build Site
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
