<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tech Insights - Blog de Tecnologia Automatizado</title>
    <meta name="description" content="Tech Insights: Sua curadoria técnica automatizada sobre Cloud Computing, Linux, Inteligência Artificial, Cybersecurity e DevOps. Artigos práticos e atualizados." />
    <meta name="keywords" content="Cloud Computing, Linux, DevOps, Inteligência Artificial, IA, Cybersecurity, Segurança da Informação, Kubernetes, AWS, Automação" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://leonardodebs.github.io/tech-insights-blog/" />
    <meta name="author" content="Tech Insights Team" />
    <!-- Fontes self-hosted via @fontsource (ver src/index.css). Sem Google Fonts. -->

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://leonardodebs.github.io/tech-insights-blog/" />
    <meta property="og:title" content="Tech Insights - Blog de Tecnologia" />
    <meta property="og:description" content="Curadoria semanal automatizada sobre Cloud, Linux, IA, Segurança, DevOps e Startups." />
    <meta property="og:image" content="https://picsum.photos/seed/tech/1200/630" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://leonardodebs.github.io/tech-insights-blog/" />
    <meta property="twitter:title" content="Tech Insights - Blog de Tecnologia" />
    <meta property="twitter:description" content="Curadoria semanal automatizada sobre Cloud, Linux, IA, Segurança, DevOps e Startups." />
    <meta property="twitter:image" content="https://picsum.photos/seed/tech/1200/630" />

    <!--
      Google Analytics NÃO é carregado aqui.

      Antes, o gtag.js era injetado incondicionalmente neste <head>, gravando
      cookies e entregando o IP do visitante ao Google antes de qualquer
      consentimento — violação da base legal exigida pela LGPD (art. 7º, I).

      Agora o script só é injetado após aceite explícito, em
      src/components/CookieConsent.tsx. O arquivo abaixo (public/consent-default.js)
      apenas declara o estado inicial de consentimento como negado, sem fazer
      nenhuma requisição de rede. É um arquivo externo, não inline, para que a
      CSP abaixo não precise de 'unsafe-inline' em script-src.
    -->
    <script src="%BASE_URL%consent-default.js"></script>

    <!--
      Content-Security-Policy via <meta> — mitigação PARCIAL, não substitui um
      cabeçalho HTTP real. Limitações conhecidas (documentadas na auditoria):
        - frame-ancestors é ignorado pelo navegador quando entregue por <meta>;
          esta CSP não protege contra clickjacking. Isso continua exigindo um
          cabeçalho real (X-Frame-Options), que GitHub Pages não permite servir.
        - report-uri/report-to e sandbox também não têm efeito via <meta>.
      Todo domínio abaixo corresponde a uma origem de fato usada pelo site
      (conferido em index.html, CookieConsent.tsx e lib/supabase.ts).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' https://www.googletagmanager.com;
        style-src 'self';
        font-src 'self';
        img-src 'self' data:;
        connect-src 'self' https://*.supabase.co https://www.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com;
        base-uri 'self';
        form-action 'self';
        object-src 'none';
      "
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
